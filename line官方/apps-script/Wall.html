<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* 投影用：固定深色（會場燈光暗），左邊大照片輪播、右邊加好友 QR ＋ 祝福捲動 */
  :root {
    --bg: #1d1418;
    --panel: #2a1d22;
    --ink: #fbeff2;
    --muted: #c8a9b3;
    --rose: #f0a6ba;
    --gold: #e9c98f;
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .wall { display: grid; grid-template-columns: 1fr minmax(300px, 27vw); grid-template-rows: minmax(0, 1fr); height: 100%; }

  /* ---- 照片區 ---- */
  .stage { position: relative; overflow: hidden; background: #000; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  .slide.on { opacity: 1; }
  .slide .blur { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(36px) brightness(.45); }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slide.on img { animation: drift 9s ease-out both; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.045); } }
  .caption {
    position: absolute; z-index: 2; left: 3vw; bottom: 3vh; display: flex; align-items: center; gap: .8em;
    padding: .55em 1.1em; border-radius: 999px; background: rgba(29, 20, 24, .72);
    font-size: clamp(16px, 1.6vw, 30px); backdrop-filter: blur(6px);
  }
  .caption .new { background: var(--rose); color: var(--bg); font-weight: 500; font-size: .7em; letter-spacing: .12em; padding: .2em .7em; border-radius: 999px; }
  .empty { position: absolute; z-index: 2; inset: 0; display: grid; place-content: center; text-align: center; gap: 1rem; color: var(--muted); }
  .empty b { font-family: var(--serif); font-size: clamp(28px, 3.4vw, 64px); color: var(--ink); font-weight: 700; }
  .empty span { font-size: clamp(16px, 1.5vw, 28px); }

  /* ---- 側欄 ---- */
  aside { display: flex; flex-direction: column; gap: 2.4vh; padding: 4vh 2.2vw; background: var(--panel); min-width: 0; min-height: 0; overflow: hidden; }
  .couple { font-family: var(--serif); font-weight: 700; font-size: clamp(26px, 2.6vw, 52px); line-height: 1.2; text-wrap: balance; }
  .couple small { display: block; font-family: var(--sans); font-weight: 400; font-size: .36em; letter-spacing: .3em; color: var(--gold); margin-bottom: .6em; }
  .join { display: flex; gap: 1.2vw; align-items: center; }
  .qr { background: #fff; padding: 10px; border-radius: 12px; line-height: 0; flex: none; }
  .qr img, .qr canvas { width: clamp(96px, 8vw, 160px) !important; height: auto !important; }
  .join p { margin: 0; font-size: clamp(14px, 1.1vw, 21px); line-height: 1.6; color: var(--muted); }
  .join p strong { color: var(--ink); font-weight: 500; }
  .join .id { color: var(--rose); font-weight: 500; }
  .count { font-size: clamp(13px, .95vw, 18px); color: var(--muted); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .count b { color: var(--gold); font-size: 1.5em; font-weight: 500; }

  .wishes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .viewport { flex: 1; min-height: 0; overflow: hidden;
    mask-image: linear-gradient(transparent, #000 10%, #000 88%, transparent);
    -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 88%, transparent); }
  .wishes h2 { margin: 0 0 1vh; font-family: var(--serif); font-size: clamp(16px, 1.3vw, 26px); color: var(--gold); font-weight: 500; }
  .roll { display: flex; flex-direction: column; gap: 1.6vh; }
  .roll.moving { animation: roll var(--dur, 60s) linear infinite; }
  @keyframes roll { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  .wish { font-size: clamp(15px, 1.15vw, 22px); line-height: 1.6; overflow-wrap: anywhere; }
  .wish i { display: block; font-style: normal; color: var(--rose); font-size: .8em; margin-top: .2em; }
  @media (prefers-reduced-motion: reduce) { .roll.moving, .slide.on img { animation: none; } .slide { transition: none; } }
</style>
</head>
<body>
<div class="wall">
  <main class="stage" id="stage">
    <div class="slide" id="slideA"><div class="blur"></div><img alt=""></div>
    <div class="slide" id="slideB"><div class="blur"></div><img alt=""></div>
    <div class="caption" id="caption" hidden><span id="capName"></span><span class="new" id="capNew" hidden>NEW</span></div>
    <div class="empty" id="empty"><b>等你傳第一張照片 📸</b><span>加右邊的 LINE 官方帳號，直接把照片傳進聊天室</span></div>
  </main>
  <aside>
    <div class="couple" id="couple"><small>OUR WEDDING DAY</small></div>
    <div class="join">
      <div class="qr" id="qr" hidden></div>
      <p><strong>掃描加入 LINE</strong><br>把照片傳到聊天室<br>就會出現在這面牆上<br><span class="id" id="basicId"></span></p>
    </div>
    <div class="count">已收到 <b id="nPhotos">0</b> 張照片 · <b id="nWishes">0</b> 則祝福</div>
    <section class="wishes">
      <h2>給新人的祝福</h2>
      <div class="viewport"><div class="roll" id="roll"></div></div>
    </section>
  </aside>
</div>

<script>
const KEY = <?!= JSON.stringify(key) ?>; // key 已在 doGet 驗證過（只有英數字）
const SLIDE_MS = 7000;   // 每張停留
const POLL_MS = 15000;   // 多久抓一次新照片

let photos = [];          // 全部照片（新到舊）
const known = new Set();  // 已知的照片 id
let fresh = [];           // 新進照片，優先播放
let cursor = 0;
let firstLoad = true;
const imgCache = new Map(); // id → dataURL，最多留 30 張
let front = document.getElementById('slideA');
let back = document.getElementById('slideB');
let wishesSig = '';

function call(fn, ...args) {
  return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](KEY, ...args));
}

async function refresh() {
  try {
    const d = await call('wallData');
    const couple = document.getElementById('couple');
    couple.lastChild.nodeType === 3 ? (couple.lastChild.textContent = d.couple) : couple.append(d.couple);
    if (d.basicId && !document.getElementById('qr').dataset.done) {
      const qr = document.getElementById('qr');
      new QRCode(qr, { text: 'https://line.me/R/ti/p/' + encodeURIComponent(d.basicId), width: 320, height: 320,
        colorDark: '#1d1418', colorLight: '#ffffff' });
      qr.dataset.done = '1';
      qr.hidden = false;
      document.getElementById('basicId').textContent = 'LINE ID：' + d.basicId;
    }
    d.photos.forEach(p => {
      if (!known.has(p.id)) {
        known.add(p.id);
        if (!firstLoad) fresh.push(p);
      }
    });
    photos = d.photos;
    firstLoad = false;
    document.getElementById('nPhotos').textContent = photos.length;
    document.getElementById('nWishes').textContent = d.blessings.length;
    document.getElementById('empty').hidden = photos.length > 0;
    renderWishes(d.blessings);
  } catch (e) {
    console.warn('refresh failed', e);
  }
}

function renderWishes(list) {
  const sig = list.map(w => w.name + w.text).join('|');
  if (sig === wishesSig) return;
  wishesSig = sig;
  const roll = document.getElementById('roll');
  roll.textContent = '';
  const make = w => {
    const div = document.createElement('div');
    div.className = 'wish';
    div.textContent = w.text;
    const by = document.createElement('i');
    by.textContent = '— ' + w.name;
    div.append(by);
    return div;
  };
  list.forEach(w => roll.append(make(w)));
  // 內容超過高度才捲動：複製一份接在後面，捲一半剛好無縫
  roll.classList.remove('moving');
  requestAnimationFrame(() => {
    if (roll.scrollHeight > roll.parentElement.clientHeight * 0.8 && list.length > 2) {
      list.forEach(w => roll.append(make(w)));
      roll.style.setProperty('--dur', Math.max(30, list.length * 6) + 's');
      roll.classList.add('moving');
    }
  });
}

async function loadPhoto(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  const url = await call('wallPhoto', id);
  if (url) {
    imgCache.set(id, url);
    if (imgCache.size > 30) imgCache.delete(imgCache.keys().next().value);
  }
  return url;
}

async function next() {
  try {
    let p = fresh.shift();
    const isNew = !!p;
    if (!p && photos.length) p = photos[cursor++ % photos.length];
    if (!p) return;
    const url = await loadPhoto(p.id);
    if (!url) return; // 被隱藏或刪掉了，下一輪再換
    back.querySelector('img').src = url;
    back.querySelector('.blur').style.backgroundImage = `url("${url}")`;
    await back.querySelector('img').decode().catch(() => {});
    back.classList.add('on');
    front.classList.remove('on');
    [front, back] = [back, front];
    document.getElementById('capName').textContent = '📸 ' + (p.name || '親友') + ' 分享';
    document.getElementById('capNew').hidden = !isNew;
    document.getElementById('caption').hidden = false;
  } catch (e) {
    console.warn('slide failed', e);
  } finally {
    setTimeout(next, SLIDE_MS);
  }
}

refresh().then(next);
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
