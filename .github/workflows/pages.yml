name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 邀請函放根目錄、規劃表放 /schedule/；line官方 只存原始碼不上線
      - name: Assemble site
        run: |
          mkdir -p _site/schedule
          cp "意願調查表 邀請函/index.html" _site/
          cp 規劃表/index.html _site/schedule/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
