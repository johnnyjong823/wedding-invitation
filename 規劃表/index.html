<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>婚禮籌備清單</title>
<meta name="description" content="2027/3/13 結婚登記、3/14 家宴的詳細籌備清單與完成進度">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2420; --muted:#7a6e66; --line:#ebe3d9;
  --accent:#b5485d; --accent-soft:#f6e4e7; --gold:#b08a4a; --done:#9a928b;
  --ok:#3f8a5a; --ok-soft:#e3f1e7; --warn:#b7791f; --warn-soft:#fbf0dc; --bad:#c0392b; --bad-soft:#fbe4e1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1917; --card:#26211e; --ink:#f1ebe4; --muted:#a8998d; --line:#3a332e;
    --accent:#e07a8e; --accent-soft:#3b2529; --gold:#d4b071; --done:#6f655d;
    --ok:#6cc08b; --ok-soft:#203126; --warn:#e3a94f; --warn-soft:#3a2f1c; --bad:#f07b6e; --bad-soft:#3d2220;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1917; --card:#26211e; --ink:#f1ebe4; --muted:#a8998d; --line:#3a332e;
  --accent:#e07a8e; --accent-soft:#3b2529; --gold:#d4b071; --done:#6f655d;
  --ok:#6cc08b; --ok-soft:#203126; --warn:#e3a94f; --warn-soft:#3a2f1c; --bad:#f07b6e; --bad-soft:#3d2220;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px}
header{text-align:center;margin-bottom:20px}
.kicker{color:var(--gold);letter-spacing:.3em;font-size:13px}
h1{font-size:28px;margin:4px 0 12px}
.dates{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.date{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px}
.date b{color:var(--accent)} .date span{color:var(--muted);font-size:14px;margin-left:6px}
.countdown{color:var(--muted);margin-top:10px}
.countdown strong{color:var(--accent);font-size:20px}
.sync{display:inline-block;margin-top:8px;font:inherit;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 12px;cursor:pointer}
.sync.err{color:var(--bad);border-color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin:14px 0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar select,.toolbar input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px}
.toolbar input{flex:1;min-width:120px}

.stage{margin-bottom:24px}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.stage-head h2{font-size:18px;margin:0}
.stage-head .when{color:var(--muted);font-size:13px}
.stage-head .sp{font-size:13px;color:var(--muted);white-space:nowrap}
.stage.key h2{color:var(--accent)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px}
.row input[type=checkbox]{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.main{flex:1;min-width:0;cursor:pointer}
.title{font-weight:600}
.item.done .title{color:var(--done);text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px}
.tag{border-radius:99px;padding:1px 8px;background:var(--line);color:var(--muted)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.opt{background:transparent;border:1px dashed var(--line)}
.owner{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 4px;flex:none}
.arrow{color:var(--muted);font-size:12px;flex:none;margin-top:4px;transition:transform .2s}
.item.open .arrow{transform:rotate(90deg)}
.detail{display:none;padding:0 14px 12px 42px}
.item.open .detail{display:block}
.sub{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:14px;cursor:pointer}
.sub input{margin-top:4px;accent-color:var(--accent)}
.sub.done span{color:var(--done);text-decoration:line-through}
.tip{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 10px;margin:8px 0}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:38px;resize:vertical}
.empty{padding:14px;color:var(--muted);font-size:14px;text-align:center}

.tools{display:flex;gap:8px;justify-content:center;margin-top:28px;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
@media print{
  .toolbar,.tools,.owner,.arrow{display:none}
  body{background:#fff}
  .detail{display:block!important}
  .stage{break-inside:avoid}
  textarea{border:0;padding:0;min-height:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">WEDDING CHECKLIST</div>
    <h1>婚禮籌備清單</h1>
    <div class="dates">
      <div class="date"><b>2027/3/13（六）</b><span>結婚登記</span></div>
      <div class="date"><b>2027/3/14（日）</b><span>家宴</span></div>
    </div>
    <div class="countdown" id="countdown"></div>
    <button class="sync" id="syncSt" hidden></button>
  </header>

  <div class="stats">
    <div class="stat ok" data-go="done"><b id="stDone">0</b><span>已完成</span></div>
    <div class="stat" data-go="todo"><b id="stTodo">0</b><span>未完成</span></div>
    <div class="stat bad" data-go="overdue"><b id="stOver">0</b><span>已逾期</span></div>
    <div class="stat warn" data-go="soon"><b id="stSoon">0</b><span>14 天內到期</span></div>
  </div>
  <div class="bar"><i id="barFill"></i></div>

  <div class="note">
    ⚠️ <b>2027 春節是 2/6（六）</b>，1 月底到 2 月中很多廠商會休假或已經滿檔，需要訂做、印刷的東西請在 <b>1 月中前</b>定案。<br>
    點任一項可展開<b>細項、提醒、備註</b>；細項全部勾完，該項會自動完成。
  </div>

  <div class="toolbar">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="todo">未完成</button>
    <button class="chip" data-f="done">已完成</button>
    <button class="chip" data-f="overdue">已逾期</button>
    <button class="chip" data-f="soon">即將到期</button>
    <select id="ownerFilter"><option value="">所有負責人</option></select>
    <input id="search" type="search" placeholder="搜尋…">
  </div>

  <div id="stages"></div>

  <div class="tools">
    <button class="chip" id="expandBtn">全部展開</button>
    <button class="chip" id="printBtn">列印</button>
    <button class="chip" id="exportBtn">匯出進度</button>
    <button class="chip" id="importBtn">匯入進度</button>
    <button class="chip" id="resetBtn">清除全部勾選</button>
    <button class="chip" id="themeBtn">切換深淺色</button>
    <button class="chip" id="syncBtn" hidden>同步設定</button>
    <button class="chip" id="linkBtn" hidden>複製同步連結</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
  <footer id="foot">勾選紀錄只存在你自己的瀏覽器裡。要跟另一半同步，可以先「匯出進度」，再把檔案傳給對方「匯入」。</footer>
</div>

try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); for(var k in S) if(p[k]) S[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} saveSync(); schedulePush();}
/* 改 S 一律走 put()，才會記進待同步；val 為 null = 清除 */
function put(type,id,val){
  if(val==null) delete S[type][id]; else S[type][id]=val;
  Y.pending[type+'.'+id]=val==null?null:val;
}

/* ===== 多人同步：Apps Script + Google Sheet（設定見 SETUP.md） ===== */
var SYNC_URL='https://script.google.com/macros/s/AKfycbzfqHpgJbPcJPT1TSIfr1l9NLDgXK9GBTQeq192FJu4epSTtWgq4-sLeywdROt-2YuJCg/exec';   // 部署好的網頁應用程式網址 https://script.google.com/macros/s/.../exec
var SK=KEY+'-sync', Y={key:'',rev:0,pending:{}};
var badKey=false, pushing=false, pulling=false, pushT=0, lastOk=0, syncErr='', needRender=false;
try{var ry=JSON.parse(localStorage.getItem(SK)); if(ry) for(var k in Y) if(ry[k]!=null) Y[k]=ry[k];}catch(e){}
(function(){ // 同步連結 ?key=… 帶進來的密碼，記下後從網址拿掉
  var m=location.search.match(/[?&]key=([^&#]+)/); if(!m) return;
  setKey(decodeURIComponent(m[1]));
  try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
})();
function saveSync(){try{localStorage.setItem(SK,JSON.stringify(Y))}catch(e){}}
function setKey(k){ if(k===Y.key) return; Y.key=k; Y.rev=0; badKey=false; saveSync(); }
function syncOn(){return !!(SYNC_URL&&Y.key&&!badKey);}

function schedulePush(){ if(!syncOn()) return; clearTimeout(pushT); pushT=setTimeout(push,700); }
function push(){
  if(!syncOn()||pushing||!Object.keys(Y.pending).length) return;
  pushing=true; var sent=JSON.parse(JSON.stringify(Y.pending)); showSync();
  fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:Y.key,changes:sent})})
    .then(function(r){return r.json()})
    .then(function(d){
      pushing=false; if(!syncResult(d)) return;
      // 送出期間又改過的欄位留著下次送
      for(var k in sent) if(JSON.stringify(Y.pending[k])===JSON.stringify(sent[k])) delete Y.pending[k];
      saveSync(); showSync(); if(Object.keys(Y.pending).length) schedulePush();
    })
    .catch(function(){pushing=false; syncErr='連不上，稍後自動重試'; showSync();});
}
function pull(){
  if(!syncOn()||pulling||document.hidden) return;
  pulling=true;
  fetch(SYNC_URL+'?key='+encodeURIComponent(Y.key)+'&since='+Y.rev)
    .then(function(r){return r.json()})
    .then(function(d){
      pulling=false; if(!syncResult(d)) return;
      var changed=false, seen={}, first=!Y.rev;
      d.changes.forEach(function(c){
        seen[c.k]=1;
        if(c.k in Y.pending) return; // 本機還沒送出的改動優先
        var i=c.k.indexOf('.'), t=c.k.slice(0,i), id=c.k.slice(i+1);
        if(!S[t]||JSON.stringify(S[t][id])===JSON.stringify(c.v==null?undefined:c.v)) return;
        if(c.v==null) delete S[t][id]; else S[t][id]=c.v;
        changed=true;
      });
      // 第一次連上：把雲端沒有的本機紀錄補上去
      if(first) for(var t in S) for(var id in S[t]) if(!seen[t+'.'+id]) Y.pending[t+'.'+id]=S[t][id];
      Y.rev=d.rev;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      saveSync(); showSync();
      if(changed) safeRender();
      push();
    })
    .catch(function(){pulling=false; syncErr='連不上，稍後自動重試'; showSync();});
}
function syncResult(d){
  if(d&&d.ok){syncErr=''; lastOk=Date.now(); return true;}
  if(d&&d.error==='bad key'){badKey=true; syncErr='同步密碼不對，點這裡重新輸入';}
  else syncErr='同步失敗，稍後自動重試';
  showSync(); return false;
}
function safeRender(){ // 正在打備註或選負責人時先不重畫，離開欄位再畫（見 focusout）
  var a=document.activeElement;
  if(a&&box.contains(a)&&(a.tagName==='TEXTAREA'||a.tagName==='SELECT')) needRender=true; else render();
}
function showSync(){
  if(!SYNC_URL) return;
  var el=document.getElementById('syncSt'), n=Object.keys(Y.pending).length;
  el.hidden=false; el.classList.toggle('err',!!syncErr||!Y.key);
  el.textContent=!Y.key?'🔒 輸入同步密碼，就能跟另一半即時同步'
    : syncErr?'⚠️ '+syncErr+(n?'（'+n+' 項尚未上傳）':'')
    : pushing||n?'🔄 同步中…'
    : lastOk?'☁️ 已同步・其他人改的內容會自動出現':'🔄 連線中…';
}
function askKey(){
  var k=prompt('輸入同步密碼（Google 試算表選單「💍 籌備清單同步 → 顯示同步密碼」可以看到）\n留空 = 停用同步，只存在這台裝置',Y.key);
  if(k==null) return; setKey(k.trim()); showSync(); pull();
}

var filter='all', ownerF='', query='', openSet={};
var today=new Date(); today.setHours(0,0,0,0);
function days(d){var x=new Date(d+'T00:00:00'); return Math.round((x-today)/86400000);}
function fmt(d){var p=d.split('-'); return (+p[1])+'/'+(+p[2]);}
function status(it){
  if(S.done[it.id]) return 'done';
  var n=days(it.due); if(n<0) return 'overdue'; if(n<=14) return 'soon'; return 'todo';
}
function subDone(it){return (it.sub||[]).filter(function(_,i){return S.sub[it.id+'_'+i]}).length;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function match(it){
  var st=status(it);
  if(filter==='done'&&st!=='done') return false;
  if(filter==='todo'&&st==='done') return false;
  if(filter==='overdue'&&st!=='overdue') return false;
  if(filter==='soon'&&st!=='soon') return false;
  if(ownerF&&(S.owner[it.id]||'未指定')!==ownerF) return false;
  if(query){var hay=(it.t+' '+(it.sub||[]).join(' ')+' '+(it.tip||'')+' '+(S.note[it.id]||'')).toLowerCase(); if(hay.indexOf(query)<0) return false;}
  return true;
}

function render(){
  var html='';
  STAGES.forEach(function(sg){
    var total=sg.items.length, done=sg.items.filter(function(i){return S.done[i.id]}).length;
    var shown=sg.items.filter(match);
    if(!shown.length&&filter!=='all') return;
    html+='<div class="stage'+(sg.key?' key':'')+'"><div class="stage-head"><div><h2>'+sg.name+'</h2><div class="when">'+sg.when+'</div></div><div class="sp">'+done+' / '+total+' 完成</div></div><div class="list">';
    if(!shown.length) html+='<div class="empty">沒有符合的項目</div>';
    shown.forEach(function(it){
      var st=status(it), n=days(it.due), sd=subDone(it), sl=(it.sub||[]).length;
      var dueTag = st==='done'?'<span class="tag ok">✓ 已完成</span>'
        : st==='overdue'?'<span class="tag bad">逾期 '+(-n)+' 天・'+fmt(it.due)+'</span>'
        : st==='soon'?'<span class="tag warn">'+(n===0?'今天到期':'剩 '+n+' 天')+'・'+fmt(it.due)+'</span>'
        : '<span class="tag">截止 '+fmt(it.due)+'</span>';
      var own=S.owner[it.id]||'未指定';
      html+='<div class="item'+(st==='done'?' done':'')+(openSet[it.id]?' open':'')+'" data-id="'+it.id+'">'
        +'<div class="row"><input type="checkbox" class="ck"'+(S.done[it.id]?' checked':'')+' aria-label="完成">'
        +'<div class="main"><div class="title">'+esc(it.t)+'</div><div class="meta">'+dueTag
        +(sl?'<span class="tag">細項 '+sd+'/'+sl+'</span>':'')
        +(it.opt?'<span class="tag opt">視需要</span>':'')
        +(S.note[it.id]?'<span class="tag">📝 有備註</span>':'')+'</div></div>'
        +'<select class="owner" title="負責人">'+OWNERS.map(function(o){return '<option'+(o===own?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'
        +'<span class="arrow">▶</span></div><div class="detail">';
      (it.sub||[]).forEach(function(s,i){
        var on=S.sub[it.id+'_'+i];
        html+='<label class="sub'+(on?' done':'')+'"><input type="checkbox" class="sk" data-i="'+i+'"'+(on?' checked':'')+'><span>'+esc(s)+'</span></label>';
      });
      if(it.tip) html+='<div class="tip">💡 '+esc(it.tip)+'</div>';
      html+='<textarea class="nt" placeholder="備註（廠商電話、金額、已付訂金…）">'+esc(S.note[it.id]||'')+'</textarea></div></div>';
    });
    html+='</div></div>';
  });
  if(!html) html='<div class="list"><div class="empty">沒有符合的項目 🎉</div></div>';
  document.getElementById('stages').innerHTML=html;
  stats();
}

function allItems(){return STAGES.reduce(function(a,s){return a.concat(s.items)},[]);}
function stats(){
  var all=allItems(), c={done:0,todo:0,overdue:0,soon:0};
  all.forEach(function(it){var st=status(it); c[st]++; });
  document.getElementById('stDone').textContent=c.done;
  document.getElementById('stTodo').textContent=all.length-c.done;
  document.getElementById('stOver').textContent=c.overdue;
  document.getElementById('stSoon').textContent=c.soon;
  document.getElementById('barFill').style.width=(c.done/all.length*100)+'%';
}
function find(id){return allItems().filter(function(i){return i.id===id})[0];}

var box=document.getElementById('stages');
box.addEventListener('change',function(e){
  var el=e.target, itemEl=el.closest('.item'); if(!itemEl) return;
  var it=find(itemEl.dataset.id);
  if(el.classList.contains('ck')){
    put('done',it.id,el.checked);
    (it.sub||[]).forEach(function(_,i){put('sub',it.id+'_'+i,el.checked)});
  }else if(el.classList.contains('sk')){
    put('sub',it.id+'_'+el.dataset.i,el.checked);
    put('done',it.id,subDone(it)===it.sub.length);
    openSet[it.id]=true;
  }else if(el.classList.contains('owner')){
    put('owner',it.id,el.value);
  }else return;
  save(); render();
});
box.addEventListener('input',function(e){
  if(!e.target.classList.contains('nt')) return;
  var id=e.target.closest('.item').dataset.id;
  put('note',id,e.target.value); save();
});
box.addEventListener('focusout',function(e){
  if(e.target.classList.contains('nt')||needRender){needRender=false; render();}
});
box.addEventListener('click',function(e){
  if(!e.target.closest('.main')&&!e.target.classList.contains('arrow')) return;
  var itemEl=e.target.closest('.item'); var id=itemEl.dataset.id;
  openSet[id]=!openSet[id]; itemEl.classList.toggle('open',!!openSet[id]);
});

function setFilter(f){
  filter=f;
  [].forEach.call(document.querySelectorAll('[data-f]'),function(b){b.classList.toggle('on',b.dataset.f===f)});
  render();
}
[].forEach.call(document.querySelectorAll('[data-f]'),function(b){b.onclick=function(){setFilter(b.dataset.f)}});
[].forEach.call(document.querySelectorAll('[data-go]'),function(b){b.onclick=function(){setFilter(b.dataset.go)}});
var of=document.getElementById('ownerFilter');
OWNERS.forEach(function(o){var op=document.createElement('option'); op.textContent=o; of.appendChild(op);});
of.onchange=function(){ownerF=of.value; render();};
document.getElementById('search').oninput=function(e){query=e.target.value.trim().toLowerCase(); render();};

var allOpen=false;
document.getElementById('expandBtn').onclick=function(){
  allOpen=!allOpen; allItems().forEach(function(i){openSet[i.id]=allOpen});
  this.textContent=allOpen?'全部收合':'全部展開'; render();
};
document.getElementById('printBtn').onclick=function(){window.print()};
document.getElementById('resetBtn').onclick=function(){
  if(!confirm('確定要清除所有勾選嗎？（負責人與備註會保留）')) return;
  ['done','sub'].forEach(function(t){for(var id in S[t]) put(t,id,null)});
  save(); render();
};
document.getElementById('exportBtn').onclick=function(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  var d=new Date(); a.download='婚禮清單進度-'+(d.getMonth()+1)+'-'+d.getDate()+'.json'; a.click();
};
var fi=document.getElementById('importFile');
document.getElementById('importBtn').onclick=function(){fi.click()};
fi.onchange=function(){
  var f=fi.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      for(var t in S){
        var np=p[t]||{};
        for(var id in S[t]) if(!(id in np)) put(t,id,null);
        for(var nid in np) put(t,nid,np[nid]);
      }
      save(); render(); alert('已匯入進度');
    }
    catch(e){alert('檔案格式不正確')}
    fi.value='';
  };
  r.readAsText(f);
};
document.getElementById('themeBtn').onclick=function(){
  var r=document.documentElement;
  var dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};

var cd=days('2027-03-13'), cdEl=document.getElementById('countdown');
cdEl.innerHTML = cd>0 ? '距離登記還有 <strong>'+cd+'</strong> 天' : cd===0 ? '就是今天！恭喜 💍' : '新婚快樂！';
render();

if(SYNC_URL){
  document.getElementById('foot').textContent='勾選、負責人、備註會自動存到雲端（Google 試算表），有同步密碼的人在其他瀏覽器上幾秒內就會看到。';
  var sb=document.getElementById('syncBtn'), lb=document.getElementById('linkBtn');
  sb.hidden=lb.hidden=false;
  sb.onclick=document.getElementById('syncSt').onclick=askKey;
  lb.onclick=function(){
    if(!Y.key) return askKey();
    var url=location.origin+location.pathname+'?key='+encodeURIComponent(Y.key);
    var fallback=function(){prompt('複製這個連結傳給另一半（打開就會自動同步）：',url)};
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(function(){alert('已複製同步連結，傳給另一半打開就能同步')},fallback);
    else fallback();
  };
  showSync(); pull();
  setInterval(pull,5000);
  document.addEventListener('visibilitychange',pull);
  window.addEventListener('online',function(){pull(); push();});
}
</script>
</body>
