<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鍾武丞・蔡嘉敏 結婚家宴</title>
<meta name="description" content="謹詹於三月十四日中午，假新竹煙波大飯店湖濱館滿月樓敬備喜筵，恭請闔第光臨。">
<meta property="og:title" content="鍾武丞・蔡嘉敏 結婚家宴 敬邀">
<meta property="og:description" content="三月十四日（星期日）中午十二時・新竹煙波大飯店湖濱館滿月樓，敬請回覆是否出席。">
<meta property="og:type" content="website">
<meta property="og:image" content="photos/01.jpg">
<meta name="theme-color" content="#8c1d1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;800&display=swap">
<style>
  :root {
    --red:      #8c1d1d;
    --red-deep: #6e1414;
    --red-soft: #f6e3df;
    --gold:     #b48a3c;
    --gold-soft:#e8d6ac;
    --paper:    #fffdf7;
    --bg:       #f3ebdd;
    --ink:      #3a2a22;
    --ink-soft: #6f5d50;
    --line:     #e4d5bb;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
    font-size: 18px; line-height: 1.8;
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0, #fbf4e6 0, transparent 60%);
  }
  img { display: block; max-width: 100%; }

  .page {
    max-width: 560px; margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .sheet {
    background: var(--paper);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 1px 0 #fff inset, 0 12px 36px rgba(110, 20, 20, .10);
    border-radius: 6px;
    position: relative;
  }
  /* 雙金線外框 */
  .sheet::before {
    content: ""; position: absolute; inset: 8px;
    border: 1px solid var(--gold); outline: 1px solid var(--gold-soft); outline-offset: 3px;
    border-radius: 3px; pointer-events: none;
  }
  section { position: relative; padding: 28px 28px; }
  .sheet > * + *, .two > * + * { border-top: 1px solid var(--line); }

  /* ---------- 照片 ---------- */
  .ph {
    position: relative; overflow: hidden;
    background: #f7f0e2;
    border: 1px dashed var(--gold);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: var(--gold); text-align: center;
  }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph.has-img { border: 0; cursor: zoom-in; background: #eee4d2; }
  .ph .ph-xi { font-size: 34px; line-height: 1; opacity: .55; }
  .ph .ph-txt { font-size: 14px; letter-spacing: 2px; margin-top: 8px; }
  .cover { padding: 26px 26px 0; }
  .cover .ph { aspect-ratio: 4 / 5; border-radius: 3px; }
  .cover .ph .ph-xi { font-size: 72px; }

  /* ---------- 邀請文 ---------- */
  .letter { text-align: center; padding-top: 30px; }
  .xi {
    width: 74px; height: 74px; margin: 0 auto 10px;
    display: grid; place-items: center;
    background: var(--red); color: #f6dfa4;
    border-radius: 50%;
    font-size: 40px; font-weight: 800; line-height: 1;
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--gold);
  }
  .eyebrow { margin: 6px 0 2px; color: var(--gold); letter-spacing: 10px; font-size: 15px; padding-left: 10px; }
  .names { margin: 4px 0 0; font-size: 30px; font-weight: 800; color: var(--red); letter-spacing: 4px; line-height: 1.5; }
  .names small { font-size: 18px; color: var(--ink-soft); font-weight: 400; margin: 0 10px; letter-spacing: 0; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px auto; max-width: 280px; color: var(--gold); font-size: 14px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .6; }
  .formal { font-size: 19px; line-height: 2.2; letter-spacing: 1px; margin: 0; }
  .formal b { color: var(--red); font-weight: 600; }
  .formal .big { font-size: 26px; font-weight: 800; color: var(--red); letter-spacing: 8px; display: block; margin-top: 4px; padding-left: 8px; }
  .sign { margin: 20px 0 0; text-align: right; font-size: 18px; letter-spacing: 2px; }

  .btn {
    font: inherit; font-weight: 600; font-size: 19px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 54px; padding: 10px 26px;
    border-radius: 999px; border: 1px solid var(--red);
    background: #fff; color: var(--red);
    text-decoration: none; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background .2s, color .2s;
  }
  .btn:hover { background: var(--red-soft); }
  .btn.solid { background: var(--red); color: #fff; }
  .btn.solid:hover { background: var(--red-deep); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .go-rsvp { margin-top: 24px; }

  h2 {
    margin: 0 0 16px; text-align: center;
    font-size: 22px; font-weight: 800; color: var(--red); letter-spacing: 6px; padding-left: 6px;
  }
  h2::after { content: ""; display: block; width: 40px; height: 2px; background: var(--gold); margin: 8px auto 0; }

  /* ---------- 宴客資訊 ---------- */
  .info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
  .info dt, .info dd { padding: 12px 0; border-bottom: 1px dotted var(--line); margin: 0; }
  .info dt { color: var(--ink-soft); padding-right: 16px; white-space: nowrap; font-size: 16px; padding-top: 14px; }
  .info dd { font-weight: 600; line-height: 1.6; }
  .info dd small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 15px; }
  .info .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }

  .info .addr-link, .lots a { color: var(--red); font-weight: 600; font-size: 16px; text-decoration: underline; text-underline-offset: 3px; }
  .info .addr-link { display: inline-block; margin-top: 4px; }
  .map { margin-top: 18px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; aspect-ratio: 4 / 3; background: #efe6d4; }
  .map iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ---------- 停車 ---------- */
  .parking .lead { text-align: center; margin: 0 0 14px; color: var(--ink-soft); font-size: 16px; }
  .lots { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: lot; }
  .lots li { position: relative; padding: 14px 16px 14px 56px; background: #faf4e8; border-radius: 10px; line-height: 1.6; }
  .lots li::before {
    counter-increment: lot; content: counter(lot);
    position: absolute; left: 14px; top: 14px;
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--red); color: #fff; font-size: 16px; font-weight: 800;
  }
  .lots .nm { font-weight: 800; font-size: 18px; }
  .lots .fee { display: inline-block; margin: 2px 0; padding: 0 10px; border-radius: 999px; background: #fff; border: 1px solid var(--gold-soft); color: var(--red-deep); font-size: 15px; font-weight: 600; }
  .lots .ds { color: var(--ink-soft); font-size: 16px; }
  .parking .note { margin: 14px 0 0; padding: 12px 14px; border-left: 3px solid var(--gold); background: #fffaf0; font-size: 16px; }

  /* ---------- 相簿 ---------- */
  .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gallery-grid .ph { aspect-ratio: 3 / 4; border-radius: 3px; }
  .gallery-grid .ph.wide { grid-column: 1 / -1; aspect-ratio: 3 / 2; }
  .gallery .hint { text-align: center; color: var(--ink-soft); font-size: 14px; margin: 12px 0 0; }

  /* ---------- 回函 ---------- */
  .rsvp .lead { text-align: center; margin: 0 0 18px; color: var(--ink-soft); font-size: 16px; }
  form { display: grid; gap: 20px; }
  form[hidden] { display: none; }
  .field { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .field > .lab, .field > legend { font-weight: 600; font-size: 18px; padding: 0; }
  .lab em { color: var(--red); font-style: normal; font-size: 15px; margin-left: 4px; }
  input[type=text], textarea {
    font: inherit; font-size: 19px; color: var(--ink);
    width: 100%; padding: 12px 14px;
    border: 1px solid #cdb995; border-radius: 8px; background: #fff;
    outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .invalid { border-color: var(--red) !important; background: #fff7f5 !important; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choices label { position: relative; cursor: pointer; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices span {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px; padding: 8px 10px;
    border: 1px solid #cdb995; border-radius: 8px; background: #fff;
    font-size: 18px; text-align: center; line-height: 1.4;
  }
  .choices span::before {
    content: ""; width: 18px; height: 18px; flex: none;
    border: 2px solid #b9a37a; border-radius: 50%; background: #fff;
  }
  .choices input:checked + span { border-color: var(--red); background: var(--red-soft); color: var(--red-deep); font-weight: 600; }
  .choices input:checked + span::before { border-color: var(--red); background: radial-gradient(circle, var(--red) 0 5px, #fff 6px); }
  .choices input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }

  #countBox { display: grid; gap: 4px; background: #faf4e8; border-radius: 10px; padding: 6px 16px; }
  #countBox[hidden] { display: none; }
  .count-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .count-row + .count-row { border-top: 1px dotted var(--line); }
  .count-row .lab { font-weight: 600; }
  .count-row .lab small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 14px; line-height: 1.4; }
  .stepper { display: flex; align-items: center; gap: 6px; flex: none; }
  .stepper button {
    width: 48px; height: 48px; padding: 0;
    font: inherit; font-size: 26px; line-height: 1;
    border: 1px solid var(--red); border-radius: 50%; background: #fff; color: var(--red);
    cursor: pointer; touch-action: manipulation;
  }
  .stepper button:active { background: var(--red-soft); }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper output { min-width: 40px; text-align: center; font-size: 24px; font-weight: 800; }

  .form-err { margin: 0; min-height: 1.4em; color: var(--red); text-align: center; font-weight: 600; }
  .submit { justify-self: center; min-width: 220px; }

  /* ---------- 完成 ---------- */
  .done { text-align: center; }
  .done[hidden] { display: none; }
  .done .mark {
    width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%;
    display: grid; place-items: center; background: var(--red); color: #fff; font-size: 32px;
  }
  .done p { margin: 8px 0; }
  .done .summary {
    margin: 16px auto; padding: 12px 16px; max-width: 360px;
    background: #faf4e8; border-radius: 10px; text-align: left; font-size: 17px;
  }
  .done .summary div { display: flex; justify-content: space-between; gap: 12px; }
  .done .summary span { color: var(--ink-soft); }

  footer { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 20px; letter-spacing: 2px; }

  /* ---------- 看大圖 ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(25, 15, 10, .92);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; cursor: zoom-out;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 3px; }
  .lightbox .close {
    position: absolute; top: 12px; right: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.6); background: rgba(0,0,0,.35); color: #fff;
    font-size: 28px; cursor: pointer;
  }

  /* ---------- 電腦版 ---------- */
  @media (min-width: 960px) {
    body { font-size: 19px; }
    .page { max-width: 1100px; padding: 40px 32px 56px; }
    .hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
    .cover { padding: 44px 0 44px 44px; }
    .letter { padding: 44px 48px; }
    .names { font-size: 36px; }
    .formal { font-size: 21px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; }
    .two > * + * { border-top: 0; border-left: 1px solid var(--line); }
    section { padding: 40px 48px; }
    .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .gallery-grid .ph.wide { grid-column: auto; aspect-ratio: 3 / 4; }
    .rsvp form, .rsvp .done, .rsvp .lead { max-width: 620px; margin-left: auto; margin-right: auto; }
  }

  @media (max-width: 420px) {
    .page { padding: 12px 10px 32px; }
    section { padding: 24px 20px; }
    .cover { padding: 20px 20px 0; }
    .names { font-size: 26px; letter-spacing: 2px; }
    .formal { font-size: 17px; letter-spacing: 0; }
    .choices span { font-size: 17px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>
</head>
<body>
<div class="page">
  <article class="sheet">

    <div class="hero">
    <!-- 封面照片 -->
    <div class="cover"><div class="ph" id="coverPhoto"></div></div>

    <!-- 邀請文 -->
    <section class="letter">
      <div class="xi" aria-hidden="true">囍</div>
      <p class="eyebrow">結婚家宴</p>
      <h1 class="names"><span id="vGroom"></span><small>與</small><span id="vBride"></span></h1>
      <div class="divider" aria-hidden="true">◆</div>
      <p class="formal" id="vFormal"></p>
      <p class="sign" id="vSign"></p>
      <a class="btn solid go-rsvp" href="#rsvp">回覆是否出席</a>
    </section>
    </div>

    <div class="two">
    <!-- 宴客資訊 -->
    <section class="info">
      <h2>宴客資訊</h2>
      <dl>
        <dt>日期</dt><dd id="vDate"></dd>
        <dt>時間</dt><dd id="vTime"></dd>
        <dt>地點</dt><dd id="vVenue"></dd>
        <dt>地址</dt><dd><span id="vAddress"></span><br><a class="addr-link" id="lnkAddr" target="_blank" rel="noopener">在 Google 地圖開啟 ›</a></dd>
        <dt id="tPhone">電話</dt><dd id="vPhone"></dd>
      </dl>
      <div class="map"><iframe id="mapFrame" title="滿月樓位置地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <div class="actions">
        <a class="btn solid" id="btnMap" target="_blank" rel="noopener">開啟導航</a>
      </div>
    </section>

    <!-- 停車 -->
    <section class="parking">
      <h2>停車資訊</h2>
      <p class="lead">開車前來的親友，可停在以下地點</p>
      <ol class="lots" id="lots"></ol>
      <p class="note" id="vParkNote"></p>
    </section>
    </div>

    <!-- 婚紗照 -->
    <section class="gallery">
      <h2>婚紗留影</h2>
      <div class="gallery-grid" id="gallery"></div>
      <p class="hint" id="galleryHint">點照片可放大觀看</p>
    </section>

    <!-- 回函 -->
    <section class="rsvp" id="rsvp">
      <h2>出席回函</h2>
      <p class="lead" id="vReplyBy">為便於安排座位，敬請撥冗回覆，謝謝。</p>

      <form id="form" novalidate>
        <label class="field">
          <span class="lab">姓名<em>（必填）</em></span>
          <input type="text" id="fName" name="name" maxlength="40" autocomplete="name" placeholder="例如：王大明">
        </label>

        <fieldset class="field">
          <legend>您是</legend>
          <div class="choices">
            <label><input type="radio" name="side" value="男方" checked><span>男方親友</span></label>
            <label><input type="radio" name="side" value="女方"><span>女方親友</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>是否出席</legend>
          <div class="choices">
            <label><input type="radio" name="attend" value="出席" checked><span>敬邀出席</span></label>
            <label><input type="radio" name="attend" value="無法出席"><span>不克出席</span></label>
          </div>
        </fieldset>

        <div id="countBox">
          <div class="count-row">
            <div class="lab">出席人數<small>（含本人）</small></div>
            <div class="stepper" data-key="count" data-min="1" data-max="10">
              <button type="button" data-d="-1" aria-label="出席人數減一">−</button>
              <output id="v-count">1</output>
              <button type="button" data-d="1" aria-label="出席人數加一">＋</button>
            </div>
          </div>
          <div class="count-row">
            <div class="lab">其中素食<small>（無則免填）</small></div>
            <div class="stepper" data-key="veg" data-min="0" data-max="10">
              <button type="button" data-d="-1" aria-label="素食人數減一">−</button>
              <output id="v-veg">0</output>
              <button type="button" data-d="1" aria-label="素食人數加一">＋</button>
            </div>
          </div>
          <div class="count-row">
            <div class="lab">兒童座椅<small>（無則免填）</small></div>
            <div class="stepper" data-key="kids" data-min="0" data-max="10">
              <button type="button" data-d="-1" aria-label="兒童座椅減一">−</button>
              <output id="v-kids">0</output>
              <button type="button" data-d="1" aria-label="兒童座椅加一">＋</button>
            </div>
          </div>
        </div>

        <label class="field">
          <span class="lab">給新人的祝福<em>（選填）</em></span>
          <textarea name="message" rows="3" maxlength="500"></textarea>
        </label>

        <p class="form-err" id="formErr" role="alert"></p>
        <button type="submit" class="btn solid submit" id="btnSubmit">送出回函</button>
      </form>

      <div class="done" id="done" hidden>
        <div class="mark" aria-hidden="true">✓</div>
        <p id="doneTitle" style="font-size:22px;font-weight:800;color:var(--red)"></p>
        <p id="doneText"></p>
        <div class="summary" id="doneSummary"></div>
        <button type="button" class="btn" id="btnEdit">修改回覆</button>
      </div>
    </section>

  </article>
  <footer id="vFooter"></footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightboxImg" alt="">
  <button type="button" class="close" aria-label="關閉">×</button>
</div>

<script>
/* =========================================================
 * ✏️ 家宴資訊：只要改這裡
 * ========================================================= */
const CONFIG = {
  groom:   "鍾武丞",
  bride:   "蔡嘉敏",
  sign:    "鍾武丞　蔡嘉敏　敬邀",         // 署名，可改成雙方家長，例如「王○○　李○○　鞠躬」

  // 邀請文用的正式日期寫法
  dateFormal:  "民國一一六年三月十四日",
  weekday:     "星期日",
  lunar:       "農曆二月初七",
  timeFormal:  "中午十二時",
  venueFormal: "新竹煙波大飯店湖濱館滿月樓",

  // 宴客資訊欄位
  date:    "2027 年 3 月 14 日（星期日）",
  dateNote:"農曆二月初七",
  time:    "中午 12:00",
  venue:   "煙波大飯店 新竹湖濱館",
  venueNote:"滿月樓 2 樓",
  address: "新竹市東區明湖路 773 號",
  phone:   "飯店總機 03-520-3181",         // 留空就不顯示
  mapUrl:  "",                             // 留空就用下面的字搜尋 Google 地圖
  mapQuery:"煙波大飯店新竹湖濱館 滿月樓",

  // 停車：map 是 Google 地圖搜尋字，留空就不顯示連結
  parking: [
    { name: "飯店地下停車場（麗池館 B1・B2）", fee: "用餐貴賓免費",
      desc: "室內停車，下雨也方便。B1 限高 3 公尺、B2 限高 2 公尺。",
      map: "煙波大飯店 新竹麗池館" },
    { name: "明湖路旁戶外停車場", fee: "用餐貴賓免費",
      desc: "飯店專屬的平面停車場，就在飯店旁邊。",
      map: "煙波大飯店新竹湖濱館 停車場" },
    { name: "以上客滿時", fee: "",
      desc: "現場停車人員會引導到特約停車場，並有接駁車送到飯店門口。",
      map: "" },
  ],
  parkNote: "星期日中午是用餐尖峰，停車可能要排一下，建議提早 15～20 分鐘到達。停車規定以飯店現場說明為準。",
  doneLine:"三月十四日中午，敬候您的光臨。",   // 送出回函後的感謝語
  replyBy: "",                             // 例如 "2027 年 2 月 28 日"，留空就不顯示截止日

  /* 婚紗照：第一張是封面，其餘依序放在「婚紗留影」。
   * 可以放 photos/ 資料夾的檔名（例如 "photos/01.jpg"），或完整網址。
   * 還沒放照片時會顯示預留框。 */
  photos: [
    "photos/01.jpg", "photos/02.jpg", "photos/03.jpg", "photos/04.jpg",
    "photos/05.jpg", "photos/06.jpg", "photos/07.jpg",
  ],
  placeholderCount: 5,                     // 沒照片時顯示幾個預留框（含封面）

  // 跟朋友宴同一個 Apps Script，用 event 區分
  event:   "家宴",
  sheetUrl: "https://script.google.com/macros/s/AKfycby_uzEXc2r9ytYSz5TIyOSCaC09dHT9EOw7ZKSNRiet3Rzh88h-8Z7wbuodYQaMnkaQ/exec",
};

/* ========================================================= */
const $ = (s) => document.querySelector(s);
const STORE_KEY = "wedding-family-rsvp";
function mapSearch(q) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }

/* ---------- 填入文字 ---------- */
$("#vGroom").textContent = CONFIG.groom;
$("#vBride").textContent = CONFIG.bride;
$("#vSign").textContent = CONFIG.sign;
$("#vFooter").textContent = `${CONFIG.groom} ・ ${CONFIG.bride}　敬邀`;
{
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  $("#vFormal").innerHTML = [
    `謹詹於　<b>${esc(CONFIG.dateFormal)}</b>`,
    `${esc(CONFIG.weekday)}　${esc(CONFIG.lunar)}　<b>${esc(CONFIG.timeFormal)}</b>`,
    `為 ${esc(CONFIG.groom)} 與 ${esc(CONFIG.bride)} 舉行結婚家宴`,
    `假座　${esc(CONFIG.venueFormal)}`,
    `敬備喜筵　恭請`,
    `<span class="big">闔第光臨</span>`,
  ].join("<br>");
  const withNote = (main, note) => esc(main) + (note ? `<small>${esc(note)}</small>` : "");
  $("#vDate").innerHTML = withNote(CONFIG.date, CONFIG.dateNote);
  $("#vTime").innerHTML = withNote(CONFIG.time);
  $("#vVenue").innerHTML = withNote(CONFIG.venue, CONFIG.venueNote);
  $("#vAddress").textContent = CONFIG.address;
  if (CONFIG.phone) $("#vPhone").textContent = CONFIG.phone;
  else { $("#tPhone").remove(); $("#vPhone").remove(); }
  $("#vParkNote").textContent = CONFIG.parkNote;
  const lots = $("#lots");
  CONFIG.parking.forEach((p) => {
    const li = document.createElement("li");
    li.innerHTML = `<div class="nm">${esc(p.name)}</div>` +
      (p.fee ? `<span class="fee">${esc(p.fee)}</span>` : "") +
      `<div class="ds">${esc(p.desc)}</div>` +
      (p.map ? `<a target="_blank" rel="noopener" href="${mapSearch(p.map)}">Google 地圖 ›</a>` : "");
    lots.appendChild(li);
  });
  if (CONFIG.replyBy) $("#vReplyBy").textContent = `為便於安排座位，敬請於 ${CONFIG.replyBy} 前回覆，謝謝。`;
}
{
  const q = CONFIG.mapQuery || CONFIG.address;
  $("#lnkAddr").href = CONFIG.mapUrl || mapSearch(q);
  $("#btnMap").href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q);
  $("#mapFrame").src = "https://maps.google.com/maps?hl=zh-TW&z=16&output=embed&q=" + encodeURIComponent(q);
}

/* ---------- 照片 ---------- */
function photoBox(src, isCover) {
  const box = document.createElement("div");
  box.className = "ph";
  if (src) {
    box.classList.add("has-img");
    const img = document.createElement("img");
    img.src = src;
    img.alt = "婚紗照";
    img.loading = isCover ? "eager" : "lazy";
    img.decoding = "async";
    box.appendChild(img);
    box.tabIndex = 0;
    box.setAttribute("role", "button");
    box.setAttribute("aria-label", "放大照片");
    box.addEventListener("click", () => openLightbox(src));
    box.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(src); } });
  } else {
    box.innerHTML = `<div class="ph-xi">囍</div><div class="ph-txt">婚紗照預留位置</div>`;
  }
  return box;
}
{
  const photos = CONFIG.photos.filter(Boolean);
  const cover = $("#coverPhoto");
  const first = photoBox(photos[0], true);
  cover.replaceWith(first);
  first.id = "coverPhoto";

  const rest = photos.length ? photos.slice(1) : Array(Math.max(0, CONFIG.placeholderCount - 1)).fill("");
  const grid = $("#gallery");
  rest.forEach((src) => grid.appendChild(photoBox(src)));
  // 張數是奇數時，最後一張橫跨兩欄，版面才不會缺一角
  if (rest.length % 2 === 1) grid.lastElementChild.classList.add("wide");
  if (!rest.length) $(".gallery").remove();
  if (!photos.length) $("#galleryHint").remove();
}

const lb = $("#lightbox");
function openLightbox(src) { $("#lightboxImg").src = src; lb.hidden = false; }
lb.addEventListener("click", () => { lb.hidden = true; });
addEventListener("keydown", (e) => { if (e.key === "Escape") lb.hidden = true; });

/* ---------- 回函：人數 ---------- */
const nums = { count: 1, veg: 0, kids: 0 };
function renderNums() {
  nums.veg = Math.min(nums.veg, nums.count);
  nums.kids = Math.min(nums.kids, nums.count);
  document.querySelectorAll(".stepper").forEach((st) => {
    const k = st.dataset.key, max = k === "count" ? +st.dataset.max : nums.count;
    $("#v-" + k).textContent = nums[k];
    st.querySelector('[data-d="-1"]').disabled = nums[k] <= +st.dataset.min;
    st.querySelector('[data-d="1"]').disabled = nums[k] >= max;
  });
}
document.querySelectorAll(".stepper").forEach((st) => {
  st.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-d]");
    if (!b) return;
    const k = st.dataset.key;
    nums[k] = Math.min(+st.dataset.max, Math.max(+st.dataset.min, nums[k] + +b.dataset.d));
    renderNums();
  });
});
renderNums();

const form = $("#form");
form.addEventListener("change", (e) => {
  if (e.target.name === "attend") $("#countBox").hidden = e.target.value !== "出席";
});
$("#fName").addEventListener("input", (e) => { e.target.classList.remove("invalid"); $("#formErr").textContent = ""; });

/* ---------- 回函：送出 ---------- */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const name = (fd.get("name") || "").trim();
  if (!name) {
    $("#fName").classList.add("invalid");
    $("#fName").focus();
    $("#formErr").textContent = "請填寫姓名，以便安排座位。";
    return;
  }
  const attending = fd.get("attend") === "出席";
  const data = {
    event: CONFIG.event,
    name,
    side: fd.get("side"),
    attend: fd.get("attend"),
    count: attending ? nums.count : 0,
    veg: attending ? nums.veg : 0,
    kids: attending ? nums.kids : 0,
    message: (fd.get("message") || "").trim(),
  };

  const btn = $("#btnSubmit");
  btn.disabled = true;
  btn.textContent = "傳送中…";
  $("#formErr").textContent = "";
  try {
    if (CONFIG.sheetUrl) {
      // text/plain 不會觸發 CORS 預檢，Apps Script 才收得到
      const res = await fetch(CONFIG.sheetUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "unknown");
    } else {
      console.warn("CONFIG.sheetUrl 尚未設定，資料沒有送出：", data);
    }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (_) {}
    showDone(data);
  } catch (err) {
    console.error(err);
    $("#formErr").textContent = "送出沒有成功，請確認網路後再按一次。";
  } finally {
    btn.disabled = false;
    btn.textContent = "送出回函";
  }
});

function showDone(d) {
  const attending = d.attend === "出席";
  $("#doneTitle").textContent = attending ? "已收到您的回函，謝謝！" : "已收到您的回覆，謝謝！";
  $("#doneText").textContent = attending
    ? CONFIG.doneLine
    : "感謝您的祝福與關心，改日再登門致意。";
  const rows = [["姓名", d.name], ["親友", d.side + "親友"], ["出席", attending ? "出席" : "不克出席"]];
  if (attending) {
    rows.push(["人數", d.count + " 位"]);
    if (d.veg) rows.push(["素食", d.veg + " 位"]);
    if (d.kids) rows.push(["兒童座椅", d.kids + " 張"]);
  }
  const box = $("#doneSummary");
  box.innerHTML = "";
  rows.forEach(([k, v]) => {
    const row = document.createElement("div");
    row.innerHTML = "<span></span><b></b>";
    row.children[0].textContent = k;
    row.children[1].textContent = v;
    box.appendChild(row);
  });
  form.hidden = true;
  $("#done").hidden = false;
}

// 修改回覆：帶回上次填的內容（同姓名再送一次會覆蓋舊的）
$("#btnEdit").addEventListener("click", () => {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (_) {}
  if (d) {
    form.elements.name.value = d.name || "";
    form.querySelectorAll('[name=side]').forEach((r) => (r.checked = r.value === d.side));
    form.querySelectorAll('[name=attend]').forEach((r) => (r.checked = r.value === d.attend));
    $("#countBox").hidden = d.attend !== "出席";
    nums.count = Math.max(1, d.count || 1); nums.veg = d.veg || 0; nums.kids = d.kids || 0;
    renderNums();
    form.elements.message.value = d.message || "";
  }
  $("#done").hidden = true;
  form.hidden = false;
  $("#fName").focus();
});

// 之前回覆過：直接顯示回覆結果
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));
  if (saved && saved.name) showDone(saved);
} catch (_) {}
</script>
</body>
</html>
